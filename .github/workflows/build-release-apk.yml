name: Build Release APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'beta-*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        if: ${{ env.RELEASE_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > sonderkey-release.jks
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" > keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=sonderkey-release.jks" >> keystore.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g
        run: |
          set -o pipefail
          if [[ "${{ github.ref_name }}" == beta-* ]]; then
            FLAVORS="assembleStandardfullRelease"
          else
            FLAVORS="assembleStandardRelease assembleOfflineRelease assembleStandardfullRelease assembleOfflineliteRelease"
          fi
          for T in $FLAVORS; do
            echo "=== building $T ==="
            ./gradlew --max-workers=2 "$T" 2>&1 | tee -a gradle-build.log
          done

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -in "e: \|error:\|FAILURE\|Caused by\|OutOfMemory\|Killed\|daemon disappeared\|Execution failed" gradle-build.log | tail -n 60 > err-index.txt || true
          grep -i -B2 -A25 "FAILURE: Build failed\|Execution failed\|daemon disappeared" gradle-build.log | head -n 120 > ctx.txt || true
          tail -n 80 gradle-build.log > tail.txt
          cat ctx.txt tail.txt > combined.txt && mv combined.txt tail.txt
          BODY="$(printf 'Error index:\n```\n%s\n```\nLog tail:\n```\n%s\n```' "$(cat err-index.txt)" "$(cat tail.txt)")"
          gh api "repos/${{ github.repository }}/issues" -f title="Release build failure (run ${{ github.run_id }})" -f body="$BODY" || true

      - name: Generate Release Notes
        # ponytail: generate release notes from changelog during build
        run: python3 docs/scripts/generate_release_notes.py

      - name: Upload APKs and Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: SonderKey-Release-APKs
          path: |
            app/build/outputs/apk/**/*.apk
            docs/releasenote/release_notes_v*.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta-')
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body_path: docs/releasenote/release_notes_temp.md
          files: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/standardfull/release/*.apk
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/offlinelite/release/*.apk

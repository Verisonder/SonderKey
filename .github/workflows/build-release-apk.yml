name: Build Release APKs

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'beta-*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        if: ${{ env.RELEASE_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > sonderkey-release.jks
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" > keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=sonderkey-release.jks" >> keystore.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g
        run: |
          set -o pipefail
          # standardfull is a superset of the other variants, so it is the only one released.
          # The rest still build locally for anyone who wants them.
          FLAVORS="assembleStandardfullRelease"
          for T in $FLAVORS; do
            echo "=== building $T ==="
            ./gradlew --max-workers=2 "$T" 2>&1 | tee -a gradle-build.log
          done

      # Failures are written to the artifacts repository rather than opened as issues here.
      # An auto-opened issue lands on the owner's public profile timeline as activity, which is a
      # misleading thing to advertise: a failed test build is a normal step in developing a branch,
      # not a defect anyone needs to see. The log is just as reachable in a file.
      - name: Record build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ARTIFACTS_PAT is not set, failure log not recorded."
            exit 0
          fi
          grep -in "e: \|error:\|FAILURE\|Caused by\|OutOfMemory\|Killed\|daemon disappeared\|Execution failed" gradle-build.log | tail -n 60 > err-index.txt || true
          grep -i -B2 -A25 "FAILURE: Build failed\|Execution failed\|daemon disappeared" gradle-build.log | head -n 120 > ctx.txt || true
          tail -n 80 gradle-build.log > tail.txt
          {
            echo "Workflow: ${{ github.workflow }}"
            echo "Branch:   ${{ github.ref_name }}"
            echo "Run:      ${{ github.run_id }}"
            echo
            echo "--- error index ---"
            cat err-index.txt
            echo
            echo "--- context ---"
            cat ctx.txt
            echo
            echo "--- log tail ---"
            cat tail.txt
          } > failure.txt
          REPO="Verisonder/vs-artifacts"
          PATH_IN_REPO="failures/latest.txt"
          SHA="$(gh api "repos/$REPO/contents/$PATH_IN_REPO" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$REPO/contents/$PATH_IN_REPO" \
              -f message="Record build failure" \
              -f content="$(base64 -w0 failure.txt)" -f sha="$SHA" >/dev/null || true
          else
            gh api --method PUT "repos/$REPO/contents/$PATH_IN_REPO" \
              -f message="Record build failure" \
              -f content="$(base64 -w0 failure.txt)" >/dev/null || true
          fi
          echo "Failure log written to $REPO/$PATH_IN_REPO"
      - name: Generate Release Notes
        # ponytail: generate release notes from changelog during build
        run: python3 docs/scripts/generate_release_notes.py

      - name: Upload APKs and Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: SonderKey-Release-APKs
          path: |
            app/build/outputs/apk/**/*.apk
            docs/releasenote/release_notes_v*.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/beta-')
        with:
          # Publish as the repository owner. The built-in token credits every release to
          # github-actions[bot]. Falls back to it if the secret is ever missing, so a release
          # still goes out rather than failing outright.
          token: ${{ secrets.RELEASE_PAT || github.token }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          body_path: docs/releasenote/release_notes_temp.md
          files: |
            app/build/outputs/apk/standard/release/*.apk
            app/build/outputs/apk/standardfull/release/*.apk
            app/build/outputs/apk/offline/release/*.apk
            app/build/outputs/apk/offlinelite/release/*.apk

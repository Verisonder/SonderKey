name: Build Test APK

# Signed release APKs for trying a change on a real device before it goes anywhere public.
#
# Publishes to Verisonder/vs-artifacts rather than to this repository, so nothing appears on the
# releases page here and there is no draft to clean up afterwards. Signed with the real release
# key, so it installs straight over a published build and keeps existing settings.
#
# Push to any test/** branch to get one. Delete the branch when finished.

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        if: ${{ env.RELEASE_KEYSTORE != '' }}
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > sonderkey-release.jks
          echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" > keystore.properties
          echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=sonderkey-release.jks" >> keystore.properties
          echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g
        run: |
          set -o pipefail
          ./gradlew --max-workers=2 assembleStandardfullRelease 2>&1 | tee -a gradle-build.log

      # Failures are written to the artifacts repository rather than opened as issues here.
      # An auto-opened issue lands on the owner's public profile timeline as activity, which is a
      # misleading thing to advertise: a failed test build is a normal step in developing a branch,
      # not a defect anyone needs to see. The log is just as reachable in a file.
      - name: Record build failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ARTIFACTS_PAT is not set, failure log not recorded."
            exit 0
          fi
          grep -in "e: \|error:\|FAILURE\|Caused by\|OutOfMemory\|Killed\|daemon disappeared\|Execution failed" gradle-build.log | tail -n 60 > err-index.txt || true
          grep -i -B2 -A25 "FAILURE: Build failed\|Execution failed\|daemon disappeared" gradle-build.log | head -n 120 > ctx.txt || true
          tail -n 80 gradle-build.log > tail.txt
          {
            echo "Workflow: ${{ github.workflow }}"
            echo "Branch:   ${{ github.ref_name }}"
            echo "Run:      ${{ github.run_id }}"
            echo
            echo "--- error index ---"
            cat err-index.txt
            echo
            echo "--- context ---"
            cat ctx.txt
            echo
            echo "--- log tail ---"
            cat tail.txt
          } > failure.txt
          REPO="Verisonder/vs-artifacts"
          PATH_IN_REPO="failures/latest.txt"
          SHA="$(gh api "repos/$REPO/contents/$PATH_IN_REPO" --jq .sha 2>/dev/null || true)"
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/$REPO/contents/$PATH_IN_REPO" \
              -f message="Record build failure" \
              -f content="$(base64 -w0 failure.txt)" -f sha="$SHA" >/dev/null || true
          else
            gh api --method PUT "repos/$REPO/contents/$PATH_IN_REPO" \
              -f message="Record build failure" \
              -f content="$(base64 -w0 failure.txt)" >/dev/null || true
          fi
          echo "Failure log written to $REPO/$PATH_IN_REPO"
      - name: Name the build after the branch and commit
        id: naming
        run: |
          SLUG="$(echo "${{ github.ref_name }}" | sed 's|^test/||' | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "tag=test-$SLUG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rename the APK so several test builds can coexist
        run: |
          SRC="$(ls app/build/outputs/apk/standardfull/release/*.apk | head -n 1)"
          cp "$SRC" "SonderKey_test-${{ steps.naming.outputs.slug }}-${{ steps.naming.outputs.sha }}.apk"
          ls -lh SonderKey_test-*.apk

      # Builds go to the artifacts repository, where the app can reach them. A draft release on
      # this repository was the older arrangement and is no longer cut: it is readable only with a
      # token, so the app could never offer it, and keeping both meant two copies of every build
      # and a draft to tidy up afterwards. Skipped when the secret is absent rather than failing.
      - name: Publish to the artifacts repository
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_PAT }}
        run: |
          # Tested in the shell rather than in an `if:`, because the secrets context is not
          # dependable in a step condition and a missing secret would silently skip nothing.
          if [ -z "$GH_TOKEN" ]; then
            echo "ARTIFACTS_PAT is not set, nothing published to the artifacts repository."
            exit 0
          fi
          TAG="${{ steps.naming.outputs.tag }}"
          REPO="Verisonder/vs-artifacts"
          gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG ${{ steps.naming.outputs.sha }}" \
            --notes "Build from \`${{ github.ref_name }}\` at \`${{ steps.naming.outputs.sha }}\`, $(date -u '+%Y-%m-%d %H:%M UTC')." \
            SonderKey_test-*.apk
          echo "Published $TAG to $REPO."

name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:

      contents: read

      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew assembleStandardDebug assembleOfflineDebug 2>&1 | tee gradle-build.log

      - name: Report build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -in "e: \|error:\|FAILURE\|Caused by\|OutOfMemory\|Killed\|daemon disappeared\|Execution failed" gradle-build.log | tail -n 60 > err-index.txt || true
          grep -i -B2 -A25 "FAILURE: Build failed\|Execution failed\|daemon disappeared" gradle-build.log | head -n 120 > ctx.txt || true
          tail -n 80 gradle-build.log > tail.txt
          cat ctx.txt tail.txt > combined.txt && mv combined.txt tail.txt
          BODY="$(printf 'Error index:\n```\n%s\n```\nLog tail:\n```\n%s\n```' "$(cat err-index.txt)" "$(cat tail.txt)")"
          gh api "repos/${{ github.repository }}/issues" -f title="Debug build failure (run ${{ github.run_id }})" -f body="$BODY" || true

      - name: Upload gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SonderKey-debug
          path: app/build/outputs/apk/**/*.apk

      - name: Archive reports for failed job
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'
        if: ${{ failure() }}
